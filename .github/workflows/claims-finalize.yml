name: Finalize Prompt 12 claims lane

on:
  push:
    branches:
      - pg/claims-temporal-relations-20260806

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: stage Prompt 12 finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Replace staging commit with validated reserved-path tree
        shell: bash
        env:
          BASE_SHA: de048bb3b34bf931b56fd741cb46c1334acdfb98
          TARGET_BRANCH: pg/claims-temporal-relations-20260806
          ARCHIVE_URL: https://filebin.net/siso-pg-p12-6f84d198cf7646b7b7df9e89/claims-lane.tar.gz
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 "$ARCHIVE_URL" --output /tmp/claims-lane.tar.gz
          rm -rf /tmp/claims-lane
          mkdir -p /tmp/claims-lane
          tar -xzf /tmp/claims-lane.tar.gz -C /tmp/claims-lane

          test -f /tmp/claims-lane/claims/core.py
          test -f /tmp/claims-lane/projections/engine.py
          test -f /tmp/claims-lane/tests/claims/test_contract.py
          test -f /tmp/claims-lane/docs/reasoning/pilot-results-2026-08-06.md
          test -f /tmp/claims-lane/docs/handoffs/claims-relations.md

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git reset --hard "$BASE_SHA"
          git clean -fdx

          rm -rf claims projections tests/claims docs/reasoning
          mkdir -p tests docs/handoffs
          cp -a /tmp/claims-lane/claims ./claims
          cp -a /tmp/claims-lane/projections ./projections
          cp -a /tmp/claims-lane/tests/claims ./tests/claims
          cp -a /tmp/claims-lane/docs/reasoning ./docs/reasoning
          cp /tmp/claims-lane/docs/handoffs/claims-relations.md ./docs/handoffs/claims-relations.md

          python -m compileall -q claims projections tests
          PYTHONPATH=. python -m unittest discover -s tests/claims -v

          git add claims projections tests/claims docs/reasoning docs/handoffs/claims-relations.md
          git diff --cached --quiet && { echo "No staged Prompt 12 changes" >&2; exit 1; }
          git commit -m "Reasoning: add claims and temporal relationships"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA"
